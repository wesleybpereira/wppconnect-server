[phases.setup]
nixPkgs = [
  "nodejs_22",
  "chromium",
  "wget",
  "unzip", 
  "fontconfig",
  "glibc",
  "alsa-lib",
  "atk",
  "cairo",
  "cups",
  "dbus",
  "expat",
  "freetype",
  "gdk-pixbuf",
  "glib", 
  "gtk3",
  "nspr",
  "pango",
  "xorg.libX11",
  "xorg.libxcb",
  "xorg.libXcomposite",
  "xorg.libXcursor",
  "xorg.libXdamage", 
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXi",
  "xorg.libXrandr",
  "xorg.libXrender",
  "xorg.libXss",
  "xorg.libXtst",
  "nss",
  "xorg.libxshmfence"
]

[start]
cmd = "node ./dist/server.js"

[variables]
NODE_ENV = "production"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "chromium"